apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
data:
  {{ printf "backend_pod_%s-frontend.yml" .Release.Name | quote }}: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{ .Release.Name }}-backend
      labels:
        app: {{ .Release.Name }}-backend
        kuiper.juno-innovations.com/kuiper-instance: {{ .Release.Name }}
      ownerReferences:
      - apiVersion: apps/v1
        controller: true
        kind: StatefulSet
        name: {{ .Release.Name }}-frontend
        uid: {{ "{{parentDeployment.metadata.uid}}" | quote }}
    spec:
      replicas: {{ .Values.nnodes }}
      selector:
        matchLabels:
          app: {{ .Release.Name }}-backend
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}-backend
          annotations:
            juno-innovations.com/workload: "Application"
            kuiper.juno-innovations.com/kuiper-instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ .Release.Name }}-backend
          {{- if .Values.gpu }}
          runtimeClassName: nvidia
          {{- end }}
          {{- if .Values.pullSecret }}
          imagePullSecrets:
            - name: "{{ .Values.pullSecret }}"
          {{- end }}
          containers:
            - name: backend
              securityContext:
                runAsUser: 0
              image: "{{ .Values.registry }}/{{ .Values.repo }}:{{ .Values.tag }}"
              resources:
                requests:
                  memory: "{{ .Values.memory }}"
                  cpu: "{{ .Values.cpu }}"
                {{- if or .Values.gpu .Values.memoryLimit .Values.cpuLimit }}
                limits:
                {{- if .Values.gpu }}
                  nvidia.com/gpu: "1"
                {{- end }}
                {{- if .Values.cpuLimit }}
                  cpu: "{{ .Values.cpuLimit }}"
                {{- end }}
                {{- if .Values.memoryLimit }}
                  memory: "{{ .Values.memoryLimit }}"
                {{- end }}
                {{- end }}
              env:
                - name: BACKEND_OVERLAY_PORT
                  value: "8081"
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: BACKEND_DEPLOYMENT_LABEL
                  value: {{ .Release.Name }}-backend
                - name: DRAGON_LOG_DEVICE_ACTOR_FILE
                  value: {{ "{{temp_log_value}}" | quote }}
                - name: DRAGON_TELEMETRY_LEVEL
                  value: {{ "{{temp_telemetry_level}}" | quote }}
                - name: DRAGON_OVERLAY_TRANSPORT
                  value: {{ "{{temp_overlay_transport}}" | quote }}
                - name: DRAGON_FE_SDESC
                  value: {{ "{{temp_fe_sdesc}}" | quote }}
                - name: FE_LABEL_SELECTOR
                  value: {{ "{{temp_fe_label}}" | quote }}
                - name: {{ "{{DRAGON_FE_GW}}" | quote }}
                  value: {{ "{{temp_fe_gw}}" | quote }}
              command: ["/bin/bash", "/tmp/launch_script/backend.sh"]
              startupProbe:
                tcpSocket:
                  port: 7575
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 21
              readinessProbe:
                tcpSocket:
                  port: 8081
                initialDelaySeconds: 10
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 3
              volumeMounts:
                - name: shm
                  mountPath: /dev/shm
                - name: launch-script-config
                  mountPath: /tmp/launch_script
                {{- if .Values.volumeMounts }}
                {{- toYaml .Values.volumeMounts | nindent 16 }}
                {{- end }}
          volumes:
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: {{ .Values.shm_size }}
            - name: launch-script-config
              configMap:
                name: {{ .Release.Name }}-launch-script
                defaultMode: 0755
            {{- if .Values.volumes }}
            {{- toYaml .Values.volumes | nindent 12 }}
            {{- end }}